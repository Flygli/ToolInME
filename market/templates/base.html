{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ИнструментДрайв{% endblock %}</title>
<link rel="stylesheet" href="{% static 'market/style.css' %}">
</head>
<body>
<header><div class="in">
  <a class="logo" href="{% url 'list' %}">🛠 ИнструментДрайв</a>
  {% if user.is_authenticated %}
    <a href="{% url 'my' %}">👤 {{ user.username }}</a>
    <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button>Выйти</button></form>
  {% else %}
    <a href="{% url 'login' %}">Войти</a> <a href="{% url 'register' %}">Регистрация</a>
  {% endif %}
  <a class="btn pri" href="{% url 'new' %}">+ Подать объявление</a>
</div></header>
<div class="wrap">
  {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
